<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
</head>
<body>
    <div class="container">
        <input type="text" id="display" readonly>
        <div class="switch">
            <div>
                <button onclick="clearDisplay()">C</button>
            </div>
            <button onclick="activityToDisplay('+')">+</button>
            <button onclick="activityToDisplay('7')">7</button>
            <button onclick="activityToDisplay('8')">8</button>
            <button onclick="activityToDisplay('9')">9</button>
            <button onclick="activityToDisplay('-')">-</button>
            <button onclick="activityToDisplay('4')">4</button>
            <button onclick="activityToDisplay('5')">5</button>
            <button onclick="activityToDisplay('6')">6</button>
            <button onclick="activityToDisplay('*')">×</button>
            <button onclick="activityToDisplay('1')">1</button>
            <button onclick="activityToDisplay('2')">2</button>
            <button onclick="activityToDisplay('3')">3</button>
            <button onclick="activityToDisplay('/')">÷</button>
            <button onclick="activityToDisplay('.')">.</button>
            <button onclick="activityToDisplay('0')">0</button>
            <button onclick="calc()">=</button>
        </div>
    </div>
</body>
</html>
